# Save as .github/workflows/card-digest.yml
# Also add requirements.txt (below) to the repo root.
#
# requirements.txt:
#   feedparser>=6.0.11
#   requests>=2.32
#   google-genai>=1.0
#   (after confirming it works, pin exact versions with `pip freeze`)

name: Card Digest

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily (runs can be delayed by 10-30+ min)
  workflow_dispatch:         # allows manual runs from the Actions tab

permissions:
  contents: write            # needed to commit seen.json back

concurrency:
  group: card-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run digest
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}  # optional repo variable, comma-separated; falls back to script default
        run: python card_digest.py

      - name: Commit seen.json
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "Update seen entries" && git push)