name: Daily Agents Runner

on:
  schedule:
    - cron: '0 21 * * *'  # Runs daily at 8 PM ET
  workflow_dispatch:       # Enables manual execution button in GitHub UI

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-genai requests playwright
          npx playwright install --with-deps chromium

      - name: Run Credit Card Agent
        run: python credit_agent.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}